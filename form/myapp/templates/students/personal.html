<!DOCTYPE html>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f5d0fe);
    min-height: 100vh;
    padding: 40px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #312e81;
    margin-bottom: 25px;
}

.profile-card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
}

.profile {
    text-align: center;
    margin-bottom: 25px;
}

.avatar {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 50%;
    background: #6366f1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

.profile h2 {
    color: #312e81;
    margin-top: 12px;
}

.profile p {
    color: #777;
    margin-top: 5px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.info-box {
    padding: 18px;
    background: #f8fafc;
    border-left: 5px solid #6366f1;
    border-radius: 10px;
}

.info-box span {
    display: block;
    color: #777;
    font-size: 13px;
    margin-bottom: 6px;
}

.info-box strong {
    color: #222;
}

.info-box:hover {
    background: #eef2ff;
    transform: translateY(-3px);
    transition: 0.3s;
}

@media (max-width: 600px) {
    .info {
        grid-template-columns: 1fr;
    }

    body {
        padding: 20px;
    }
}
</style>
<body>
    <div class="container">
    <h1>Student Personal Information</h1>
<form method="post">
    {% csrf_token %}
    <!-- <div class="info"> -->

    {{form.as_p}}
    <button type="submit" class="info-box">submit</form>
</body>
