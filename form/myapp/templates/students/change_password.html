
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | MyLMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at top left, #dbeafe 0, transparent 38%),
                radial-gradient(circle at bottom right, #f5d0fe 0, transparent 40%),
                linear-gradient(135deg, #f8fafc, #eef2ff);
        }

        .password-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid white;
            box-shadow: 0 15px 40px rgba(51, 65, 85, 0.12);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            background: #ede9fe;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #4338ca;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px #c7d2fe66;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px #a855f744;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
            font-size: 14px;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .hint {
            margin-top: 7px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .password-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="password-card">

    <div class="icon">🔐</div>

    <h1>Change Password</h1>

    <p class="subtitle">
        Hello, {{ student.name }}!<br>
        Update your password to keep your account secure.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {% if message.tags == 'success' %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'student_change_password' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="old_password">Current Password</label>

            <input
                type="password"
                id="old_password"
                name="old_password"
                placeholder="Enter your current password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="new_password">New Password</label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <p class="hint">Minimum 8 characters.</p>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your new password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" class="submit-btn">
            Update Password
        </button>
    </form>

    <a href="{% url 'student_dashboard' %}" class="back-link">
        ← Back to Student Dashboard
    </a>

</div>

</body>
</html>
