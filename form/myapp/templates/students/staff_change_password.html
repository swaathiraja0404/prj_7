<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f5d0fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .password-card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button, .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: #4f46e5;
            color: white;
        }

        .back-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #fef2f2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="password-card">
        <h2>Change Password</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags == 'success' %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="old_password">Current Password</label>
            <input
                type="password"
                id="old_password"
                name="old_password"
                required
            >

            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                minlength="8"
                required
            >

            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                required
            >

            <button type="submit">Update Password</button>
        </form>

        <a href="{% url 'staff_dashboard' %}" class="back-btn">
            Back to Dashboard
        </a>
    </div>
</body>
</html>
